<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>15 Sliding Block Puzzle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f0f2f5;
            touch-action: none; 
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-h-screen;
        }

        .puzzle-container {
            position: relative;
            width: 340px;
            height: 340px;
            background-color: #bbada0;
            padding: 12px;
            border-radius: 12px;
            user-select: none;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            touch-action: none;
        }

        .tile {
            position: absolute;
            width: 70px;
            height: 70px;
            background-color: #eee4da;
            color: #776e65;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 600;
            border-radius: 8px;
            cursor: grab;
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.2s ease;
            box-shadow: 0 4px 0px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .tile:active {
            cursor: grabbing;
            filter: brightness(0.95);
        }

        .tile.correct {
            background-color: #edc22e;
            color: white;
        }

        .grid-placeholder {
            position: absolute;
            width: 70px;
            height: 70px;
            background-color: rgba(238, 228, 218, 0.35);
            border-radius: 8px;
        }

        @media (max-width: 380px) {
            .puzzle-container {
                width: 300px;
                height: 300px;
                padding: 10px;
            }
            .tile, .grid-placeholder {
                width: 62px;
                height: 62px;
            }
            .tile { font-size: 24px; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <h1 class="text-4xl font-bold mb-6 text-[#776e65]">15 Puzzle</h1>

    <div id="puzzle-board" class="puzzle-container mb-8">
        <!-- Generated by JS -->
    </div>

    <div class="flex flex-col items-center gap-6">
        <button id="reset-btn" class="bg-[#8f7a66] hover:bg-[#776e65] text-white px-10 py-3 rounded-full font-semibold transition-all shadow-lg active:scale-95">
            เริ่มเกมใหม่
        </button>

        <div class="text-[#776e65] text-center space-y-2 max-w-xs">
            <p class="font-bold text-lg">การควบคุม</p>
            <p class="bg-white/50 px-4 py-2 rounded-lg border border-gray-200 text-sm">
                ลากบล็อคไปยังช่องว่างเพื่อเลื่อนให้ตรงช่อง
            </p>
        </div>
    </div>

    <!-- Win Message -->
    <div id="win-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-white p-10 rounded-3xl shadow-2xl text-center max-w-sm w-full mx-4">
            <div class="text-6xl mb-4">🎉</div>
            <h2 class="text-3xl font-bold text-gray-800 mb-6">คุณชนะแล้ว!</h2>
            <button onclick="initGame()" class="w-full bg-[#edc22e] hover:bg-[#e2b000] text-white py-4 rounded-2xl font-bold text-xl transition-all shadow-md active:scale-95">
                เล่นอีกครั้ง
            </button>
        </div>
    </div>

    <script>
        let TILE_SIZE, GAP, PADDING;

        function updateDimensions() {
            if (window.innerWidth <= 380) {
                TILE_SIZE = 62; GAP = 10; PADDING = 10;
            } else {
                TILE_SIZE = 70; GAP = 12; PADDING = 12;
            }
        }

        let tiles = []; 
        let emptyPos = 15; 
        let dragStartX = 0, dragStartY = 0, isDragging = false;
        
        const board = document.getElementById('puzzle-board');
        const winModal = document.getElementById('win-modal');

        function getCoords(index) {
            const row = Math.floor(index / 4);
            const col = index % 4;
            return {
                x: PADDING + col * (TILE_SIZE + GAP),
                y: PADDING + row * (TILE_SIZE + GAP)
            };
        }

        function initGame() {
            updateDimensions();
            board.innerHTML = '';
            tiles = [];
            
            // Background grid
            for (let i = 0; i < 16; i++) {
                const placeholder = document.createElement('div');
                placeholder.className = 'grid-placeholder';
                const coords = getCoords(i);
                placeholder.style.left = `${coords.x}px`;
                placeholder.style.top = `${coords.y}px`;
                board.appendChild(placeholder);
            }

            let indices;
            do {
                indices = [...Array(16).keys()];
                for (let i = indices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [indices[i], indices[j]] = [indices[j], indices[i]];
                }
            } while (!isSolvable(indices) || isSolved(indices));

            emptyPos = indices.indexOf(15); 

            indices.forEach((valIdx, boardPos) => {
                if (boardPos === emptyPos) return;

                const val = valIdx + 1;
                const tileDiv = document.createElement('div');
                tileDiv.className = 'tile';
                tileDiv.textContent = val;
                
                const startEvent = (e) => {
                    const clientX = e.clientX || e.touches[0].clientX;
                    const clientY = e.clientY || e.touches[0].clientY;
                    dragStartX = clientX;
                    dragStartY = clientY;
                    isDragging = true;
                };

                tileDiv.addEventListener('mousedown', startEvent);
                tileDiv.addEventListener('touchstart', startEvent, {passive: true});

                const tileObj = { value: val, element: tileDiv, currentPos: boardPos };
                tiles.push(tileObj);
                board.appendChild(tileDiv);
                updateTilePosition(tileObj);
            });

            winModal.classList.add('hidden');
        }

        function handleMove(clientX, clientY) {
            if (!isDragging) return;
            
            const diffX = clientX - dragStartX;
            const diffY = clientY - dragStartY;
            const threshold = 35; 

            if (Math.abs(diffX) > threshold || Math.abs(diffY) > threshold) {
                isDragging = false; 
                
                const row = Math.floor(emptyPos / 4);
                const col = emptyPos % 4;
                let targetPos = -1;

                if (Math.abs(diffX) > Math.abs(diffY)) {
                    // horizontal
                    if (diffX > 0 && col > 0) targetPos = emptyPos - 1; // Drag right
                    else if (diffX < 0 && col < 3) targetPos = emptyPos + 1; // Drag left
                } else {
                    // vertical
                    if (diffY > 0 && row > 0) targetPos = emptyPos - 4; // Drag down
                    else if (diffY < 0 && row < 3) targetPos = emptyPos + 4; // Drag up
                }

                if (targetPos !== -1) {
                    const tile = tiles.find(t => t.currentPos === targetPos);
                    if (tile) {
                        const oldEmpty = emptyPos;
                        emptyPos = targetPos;
                        tile.currentPos = oldEmpty;
                        updateTilePosition(tile);
                        checkWin();
                    }
                }
            }
        }

        window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('touchend', () => isDragging = false);

        function updateTilePosition(tileObj) {
            const coords = getCoords(tileObj.currentPos);
            tileObj.element.style.transform = `translate(${coords.x}px, ${coords.y}px)`;
            
            // Highlight correct position
            if (tileObj.value === tileObj.currentPos + 1) {
                tileObj.element.classList.add('correct');
            } else {
                tileObj.element.classList.remove('correct');
            }
        }

        function isSolvable(arr) {
            let inv = 0;
            const flat = arr.filter(v => v !== 15);
            for (let i = 0; i < flat.length; i++) {
                for (let j = i + 1; j < flat.length; j++) if (flat[i] > flat[j]) inv++;
            }
            const emptyR = 4 - Math.floor(arr.indexOf(15) / 4);
            return (emptyR % 2 === 0) ? (inv % 2 !== 0) : (inv % 2 === 0);
        }

        function isSolved(arr) {
            for (let i = 0; i < 15; i++) if (arr[i] !== i) return false;
            return true;
        }

        function checkWin() {
            const win = tiles.every(t => t.value === t.currentPos + 1);
            if (win) {
                setTimeout(() => winModal.classList.remove('hidden'), 400);
            }
        }

        document.getElementById('reset-btn').onclick = initGame;
        window.onresize = () => { updateDimensions(); tiles.forEach(updateTilePosition); };
        window.onload = initGame;
    </script>
</body>
</html>
